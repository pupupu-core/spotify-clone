name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  NODE_VERSION: 24
  PNPM_VERSION: 10.33.2
  IMAGE_REF_NAME: ${{ github.ref_name }}
  IMAGE_SHA: ${{ github.sha }}
  API_DOCKER_FILE: apps/api/dockerfile
  WEB_DOCKER_FILE: apps/web/dockerfile
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
  DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}

jobs:
  checks:
    name: Build before deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs:
      - checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.API_DOCKER_FILE }}
          push: true
          build-args: |
            DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/pupufy-api:${{ env.IMAGE_REF_NAME }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/pupufy-api:${{ env.IMAGE_SHA }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.WEB_DOCKER_FILE }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/pupufy-web:${{ env.IMAGE_REF_NAME }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/pupufy-web:${{ env.IMAGE_SHA }}

  deploy:
    name: Run server deploy script
    runs-on: ubuntu-latest
    needs:
      - build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy.sh over SSH
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SCRIPT_PATH: ${{ vars.DEPLOY_SCRIPT_PATH }}
        run: bash scripts/deploy-ssh.sh
