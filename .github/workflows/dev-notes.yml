name: Check Development Notes

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronized, reopened, ready_for_review]

jobs:
  validate-files:
    if: github.event.pull_request.head.ref == 'development-notes'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            development-notes/**

      - name: Verify allowed directory
        if: steps.changed-files.outputs.any_modified == 'true' && steps.changed-files.outputs.only_modified == 'false'
        run: |
          echo "❌ Ошибка: В этом PR изменены файлы за пределами папки development-notes!"
          echo "Пожалуйста, уберите изменения из других директорий."
          exit 1

      - name: Success message
        if: steps.changed-files.outputs.only_modified == 'true'
        run: |
          echo "✅ Отлично! Изменения находятся строго внутри папки development-notes/."