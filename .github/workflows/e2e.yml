name: E2E

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.33.2
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pupufy_test
  JAMENDO_API_KEY: ${{ secrets.JAMENDO_API_KEY }}
  JAMENDO_API_CLIENT_ID: ${{ secrets.JAMENDO_API_CLIENT_ID }}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pupufy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run Prisma migrations
        run: pnpm exec prisma migrate deploy

      - name: Install Playwright Browsers
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        timeout-minutes: 15
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/apps/e2e/playwright-report
          retention-days: 30
