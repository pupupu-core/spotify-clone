server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location ~* ^/favicon\.(?:ico|svg|png|jpeg|jpg|gif|webp)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  location = /robots.txt {
    try_files /robots.txt =404;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|avif|woff2?)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
