<div class="toast">
  <div matSnackBarLabel class="content">
    <p class="header">{{ payload.header }}</p>
    <p class="text">{{ payload.text }}</p>
  </div>

  <div matSnackBarAction class="actions">
    <button
      matButton
      matSnackBarAction
      matIconButton
      class="close"
      type="button"
      (click)="dismiss()"
    >
      <mat-icon>cancel</mat-icon>
    </button>
  </div>
</div>
