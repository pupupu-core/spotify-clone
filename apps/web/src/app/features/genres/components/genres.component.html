<section class="genres">
  <h2 class="title">Choose your genre</h2>

  <ul class="list">
    @for (genre of genreList(); track genre) {
      <li class="genre">
        <button
          class="chip"
          type="button"
          [routerLink]="routes.SEARCH.to"
          [queryParams]="{ genres: genre }"
        >
          <span>{{ genre }}</span>
        </button>
      </li>
    }
  </ul>
</section>
