<mat-dialog-content class="create-playlist-dialog">
  <mat-dialog-actions class="close-container" [mat-dialog-close]="true">
    <button matIconButton aria-label="Close create playlist button">
      <mat-icon>close</mat-icon>
    </button>
  </mat-dialog-actions>
  <div class="playlist-info">
    <div class="upload-cover-container">
      @if (mockCoverPreview()) {
        <img src="/img/album-bg-mock.png" alt="" />
      } @else {
        <label for="player-cover" class="empty-content">
          <mat-icon
            aria-hidden="false"
            aria-label="upload track icon"
            fontSet="material-icons-outlined"
          >
            image_arrow_up
          </mat-icon>
          <span>upload playlist cover</span>
        </label>
        <input type="file" id="player-cover" class="hidden" />
      }
    </div>
    <div class="playlist-fields">
      <mat-form-field appearance="outline">
        <mat-label>Playlist Name</mat-label>
        <input matInput />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Playlist description</mat-label>
        <textarea matInput></textarea>
      </mat-form-field>
    </div>
  </div>
  <div class="search-track">
    <!--    TODO: вынести search бар в feature/components? и добавить сюда-->
    <mat-form-field appearance="outline" class="search-bar" subscriptSizing="dynamic">
      <input
        class="search-input"
        matInput
        type="search"
        placeholder="Start for search songs, albums, authors..."
        autocomplete="off"
      />
      <button type="submit" matSuffix matIconButton aria-label="Search button">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
    <ppf-tracks-list [trackList]="[]" mode="list" headerControl="noControl" title="Search result" />
  </div>
  <mat-dialog-actions class="actions-buttons">
    <button matButton="text" [mat-dialog-close]="true" class="cancel">Cancel</button>
    <button matButton="tonal" class="create">Create</button>
  </mat-dialog-actions>
</mat-dialog-content>
