<div class="track-container" [class.isPlaying]="isPlaying()">
  <div class="album-title-container">
    <div class="album-name-container">
      <p>{{ track().album_name }}</p>
    </div>
    <div class="album-img-container">
      <img class="album-img" [src]="track().album_image || track().image" alt="" />
    </div>
    <div class="title-container">
      <h3 class="author-name">{{ track().artist_name }}</h3>
      <h4 class="track-name">{{ track().name }}</h4>
    </div>
  </div>
  <div class="track-info">
    <p class="play-count">
      <mat-icon
        inline
        aria-hidden="false"
        aria-label="headphones icon"
        fontSet="material-icons-outlined"
      >
        headphones
      </mat-icon>
      {{ 100000 | abbreviatedNumber }}
    </p>
    <p class="duration">
      <mat-icon
        inline
        class="icon-md"
        aria-hidden="false"
        aria-label="timer icon"
        fontSet="material-icons-outlined"
      >
        timer
      </mat-icon>
      {{ track().duration | duration }}
    </p>
  </div>
  <button
    matIconButton
    aria-label="Example icon button with a vertical three dot icon"
    (click)="playClick.emit()"
  >
    <mat-icon fontSet="material-icons-outlined">
      {{ isPlaying() ? 'pause_circle' : 'play_circle' }}
    </mat-icon>
  </button>
</div>
