@if (view() === 'row') {
  <ppf-tracks-row
    [isPlaying]="isPlaying()"
    [track]="track()"
    [playlistCreateMode]="playlistCreateMode()"
    [playlistEditMode]="playlistEditMode()"
    [selectedForPlaylist]="selectedForPlaylist()"
    (playClick)="playClick.emit()"
    (addClick)="addClick.emit()"
    (removeClick)="removeClick.emit()"
  />
} @else if (view() === 'card') {
  <ppf-tracks-card [isPlaying]="isPlaying()" [track]="track()" (playClick)="playClick.emit()" />
}
