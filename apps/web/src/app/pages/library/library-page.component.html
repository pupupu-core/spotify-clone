<div class="library-page">
  <div class="main-content">
    <div class="welcome">
      HELLO!<br />
      <span>We tuned the sound just for you,</span><br />
      {{ store.displayName() || 'Listener' }}.
    </div>
    <button class="upload-button" matFab extended (click)="openUploadTrackForm()">
      <div>
        <mat-icon
          aria-hidden="false"
          aria-label="upload track icon"
          fontSet="material-icons-outlined"
        >
          cloud_upload
        </mat-icon>
        <span>upload new track</span>
      </div>
    </button>
    <ppf-playlist-shelf
      class="playlist"
      title="My Playlist"
      mode="library"
      [albumsList]="[myUploadsVirtualPlaylist(), ...store.userPlaylists()]"
      (createNew)="openPlaylistForm()"
      (playlistClick)="openEditPlaylist($event)"
    />
  </div>
  <div class="recently-played">
    <ppf-tracks-list
      headerControl="sort"
      ulMode="unnumbered"
      [trackList]="uploadedTracks()"
      mode="list"
      title="My uploads"
      (addClick)="openAddToPlaylist($event)"
    />
  </div>
</div>
