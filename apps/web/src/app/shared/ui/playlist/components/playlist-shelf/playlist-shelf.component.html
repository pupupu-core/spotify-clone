<div class="playlist-shelf">
  <h2 class="title">{{ title() }}</h2>
  <div class="playlist-shelf-inner" #playlistShelfInner (wheel)="wheelHandler($event)">
    @if (albumsList().length > 0) {
      @for (album of albumsList(); track album.id) {
        <ppf-playlist-card
          [album]="album"
          [mode]="mode()"
          (playlistClick)="playlistClick.emit(album.id)"
        />
      }
    } @else {
      <div class="albums-empty">No albums available yet.</div>
    }
  </div>
</div>
