name: pupufy-app

services:
  db:
    image: postgres:18
    container_name: pupufy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pupufy_app
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pupufy
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
