allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  argon2: true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  prisma: true
  unrs-resolver: true
autoInstallPeers: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@angular/*'
  - 'terser'
